services:
  ninja.eshop.catalog.api:
    image: ${DOCKER_REGISTRY-}ninjaeshopcatalogapi
    build:
      context: src
      dockerfile: NINJA.EShop.Catalog/NINJA.EShop.Catalog.API/Dockerfile
    depends_on:
      - ninja.eshop.catalog.Db

  ninja.eshop.basket.api:
    image: ${DOCKER_REGISTRY-}ninjaeshopbasketapi
    build:
      context: src
      dockerfile: NINJA.EShop.Basket/NINJA.EShop.Basket.API/Dockerfile
    depends_on:
      - ninja.eshop.basket.Db

  ninja.eshop.catalog.Db:
    image: postgres:16
    restart: always

  ninja.eshop.basket.Db:
    image: postgres:16
    restart: always

  ninja.eshop.distibutedCache:
    image: redis
    restart: always

volumes:
  postgres_catalog:
  postgres_basket: